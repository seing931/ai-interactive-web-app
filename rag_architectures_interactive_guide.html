<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Architectures Interactive Guide</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel Standalone for JSX runtime -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace']

      }
    }
  </script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      height: 6px;
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #0f172a;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-purple-600 selection:text-white">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const RAG_ARCHITECTURES = [
      {
        id: 1,
        name: 'Naive RAG',
        badge: '1',
        tagline: 'Simple & effective for straightforward information needs.',
        category: 'Basic Retrieval',
        color: 'from-blue-500 to-cyan-500',
        borderColor: 'border-blue-500',
        textColor: 'text-blue-400',
        bgColor: 'bg-blue-500/10',
        accentHex: '#3b82f6',
        iconClass: 'fa-solid fa-database',
        overview: 'The foundational RAG pattern. Chunks text documents, embeds them into a Vector Database, retrieves top-K matches using semantic cosine similarity, and passes context to an LLM generator.',
        whenToUse: 'Quick prototypes, basic internal knowledge bases, static QA documentation with limited complexity.',
        limitations: 'Prone to chunk boundary context loss, keyword misalignment, and struggles with complex multi-hop queries.',
        metrics: { complexity: 'Low (1/5)', latency: 'Fast (~300ms)', cost: 'Very Low', accuracy: '65-75%' },
        pipelineNodes: [
          { id: 'data', label: 'Data Sources', type: 'storage', desc: 'Raw text documents & PDFs' },
          { id: 'embed', label: 'Embedding', type: 'process', desc: 'Dense vector representation generation' },
          { id: 'vecdb', label: 'Vector DB', type: 'storage', desc: 'Stores & indexes vector chunks' },
          { id: 'query', label: 'User Query', type: 'input', desc: 'User enters a natural query' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Synthesizes answer with prompt + retrieved context' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Final grounded answer output' }
        ],
        components: ['Data Sources', 'Embedding Model', 'Vector Database', 'Prompt Formatter', 'LLM Generator']
      },
      {
        id: 2,
        name: 'Graph RAG',
        badge: '2',
        tagline: 'Leverages relationships in data for deeper insights.',
        category: 'Structured Knowledge Graph',
        color: 'from-amber-500 to-orange-500',
        borderColor: 'border-amber-500',
        textColor: 'text-amber-400',
        bgColor: 'bg-amber-500/10',
        accentHex: '#f59e0b',
        iconClass: 'fa-solid fa-diagram-project',
        overview: 'Extracts entities, relationships, and communities during ingestion into a Knowledge Graph. Converts user queries into Cypher/Gremlin graph subqueries to extract connected relational context.',
        whenToUse: 'Multi-hop entity relationships, organizational charts, lineage tracking, entity connection queries ("How is X related to Y?").',
        limitations: 'High initial indexing cost, longer latency, and requires specialized LLM prompts for entity extraction.',
        metrics: { complexity: 'High (4/5)', latency: 'Moderate (~800ms)', cost: 'High Indexing', accuracy: '85-92%' },
        pipelineNodes: [
          { id: 'data', label: 'Data Sources', type: 'storage', desc: 'Raw unstructured documents' },
          { id: 'graphgen', label: 'Graph Generator', type: 'process', desc: 'Extracts entities & relationship triples' },
          { id: 'graphdb', label: 'Graph DB', type: 'storage', desc: 'Stores nodes & relational edges' },
          { id: 'qgen', label: 'Query Generator', type: 'process', desc: 'Translates query into Cypher/Graph query' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Synthesizes response from subgraphs' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Relational multi-hop answer' }
        ],
        components: ['Data Sources', 'Graph Generator', 'Query Generator', 'Graph DB (Neo4j/Memgraph)', 'LLM Generator']
      },
      {
        id: 3,
        name: 'Hybrid RAG',
        badge: '3',
        tagline: 'Combines multiple retrieval methods for higher accuracy.',
        category: 'Multi-Modal Search',
        color: 'from-emerald-500 to-green-500',
        borderColor: 'border-emerald-500',
        textColor: 'text-emerald-400',
        bgColor: 'bg-emerald-500/10',
        accentHex: '#10b981',
        iconClass: 'fa-solid fa-layer-group',
        overview: 'Executes semantic vector search, lexical keyword search (BM25), graph retrieval, and semantic cross-encoders in parallel. Merges and re-ranks candidate passages using Reciprocal Rank Fusion (RRF).',
        whenToUse: 'Enterprise search engines where exact model numbers/SKUs and broad contextual questions must both be answered reliably.',
        limitations: 'Increases pipeline complexity, requires multiple database indices, slightly higher compute consumption.',
        metrics: { complexity: 'Moderate-High (3.5/5)', latency: 'Moderate (~600ms)', cost: 'Moderate', accuracy: '90-95%' },
        pipelineNodes: [
          { id: 'query', label: 'User Query', type: 'input', desc: 'Dispatched to multi-retriever orchestrator' },
          { id: 'retrievers', label: 'Parallel Retrievers', type: 'split', desc: 'Vector DB + Lexical (BM25) + Graph DB + Semantic' },
          { id: 'rrf', label: 'RRF & Re-Ranker', type: 'process', desc: 'Fuses scores into unified top-K ranking' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Receives optimal hybrid context window' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'High-precision consolidated response' }
        ],
        components: ['Vector DB', 'Lexical Index (BM25)', 'Graph DB', 'Cross-Encoder Re-Ranker', 'LLM Generator']
      },
      {
        id: 4,
        name: 'HyDE (Hypothetical Document Embeddings)',
        badge: '4',
        tagline: 'Generates hypothetical docs to improve retrieval.',
        category: 'Query Transformation',
        color: 'from-yellow-500 to-amber-400',
        borderColor: 'border-yellow-500',
        textColor: 'text-yellow-400',
        bgColor: 'bg-yellow-500/10',
        accentHex: '#eab308',
        iconClass: 'fa-solid fa-file-pen',
        overview: 'Uses an upfront LLM to generate a hypothetical answer document for the user query. Embeds this synthetic candidate document and searches vector space for real documents with matching structure.',
        whenToUse: 'Short, vague, or abstract queries where user phrasing differs significantly from source documentation terminology.',
        limitations: 'Extra preliminary LLM call increases baseline latency; poor prompt engineering can cause hypothetical hallucinations.',
        metrics: { complexity: 'Moderate (2.5/5)', latency: 'Moderate (~700ms)', cost: 'Low-Moderate', accuracy: '82-88%' },
        pipelineNodes: [
          { id: 'query', label: 'User Query', type: 'input', desc: 'Abstract user question' },
          { id: 'hypo', label: 'Hypothetical Document', type: 'llm', desc: 'LLM drafts synthetic candidate document' },
          { id: 'embed', label: 'Embedding', type: 'process', desc: 'Embeds synthetic hypothetical text' },
          { id: 'vecdb', label: 'Vector DB', type: 'storage', desc: 'Finds real documents close to synthetic vector' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Synthesizes final answer with verified real context' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Accurate grounded answer' }
        ],
        components: ['Hypothetical Doc Prompt', 'Embedding Model', 'Vector DB', 'Final LLM Generator']
      },
      {
        id: 5,
        name: 'Contextual RAG',
        badge: '5',
        tagline: 'Adds surrounding context for more relevant results.',
        category: 'Enriched Vector Search',
        color: 'from-indigo-500 to-blue-600',
        borderColor: 'border-indigo-500',
        textColor: 'text-indigo-400',
        bgColor: 'bg-indigo-500/10',
        accentHex: '#6366f1',
        iconClass: 'fa-solid fa-brain',
        overview: 'During indexing, each chunk is processed by an LLM alongside its whole parent document ("Reason on Every Chunk") to attach concise document-level explanatory metadata before vector embedding.',
        whenToUse: 'Financial statements, legal contracts, dense technical specifications where sentences in isolation lack key subject context.',
        limitations: 'One-time indexing step requires significant upfront LLM compute cost.',
        metrics: { complexity: 'Moderate (3/5)', latency: 'Fast Query (~350ms)', cost: 'High Index / Low Query', accuracy: '88-94%' },
        pipelineNodes: [
          { id: 'data', label: 'Data Sources', type: 'storage', desc: 'Full parent documents' },
          { id: 'reason', label: 'Reason on Every Chunk', type: 'process', desc: 'LLM prepends surrounding document context' },
          { id: 'chunks', label: 'Enriched Chunks', type: 'process', desc: '[Document Context + Chunk Text]' },
          { id: 'vecdb', label: 'Vector DB', type: 'storage', desc: 'Stores contextualized vector chunks' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Receives fully contextualized snippets' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Coherent contextual answer' }
        ],
        components: ['Chunk Contextualizer LLM', 'Embedding Engine', 'Vector DB', 'LLM Generator']
      },
      {
        id: 6,
        name: 'Adaptive RAG',
        badge: '6',
        tagline: 'Adapts the retrieval path based on query complexity.',
        category: 'Dynamic Query Routing',
        color: 'from-rose-500 to-red-500',
        borderColor: 'border-rose-500',
        textColor: 'text-rose-400',
        bgColor: 'bg-rose-500/10',
        accentHex: '#f43f5e',
        iconClass: 'fa-solid fa-compass',
        overview: 'Uses a lightweight Query Analyzer classifier upfront. Simple queries route directly to LLM for instant response; moderate queries trigger vector retrieval; complex queries trigger multi-step iterative retrieval loops.',
        whenToUse: 'High-volume production applications with mixed query complexity ranging from simple casual chat to complex multi-step analytical queries.',
        limitations: 'Requires training or prompting a fast query classifier; misclassifications may impact latency or answer quality.',
        metrics: { complexity: 'High (4/5)', latency: 'Dynamic (100ms - 1200ms)', cost: 'Lowest Avg Cost', accuracy: '92-96%' },
        pipelineNodes: [
          { id: 'query', label: 'User Query', type: 'input', desc: 'Arrives at classifier gateway' },
          { id: 'analyzer', label: 'Query Analyzer', type: 'process', desc: 'Evaluates intent, complexity, and route' },
          { id: 'routes', label: 'Routing Decision', type: 'split', desc: 'Direct LLM vs Vector Search vs Multi-step Loop' },
          { id: 'vecdb', label: 'Vector DB', type: 'storage', desc: 'Accessed only when retrieval is required' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Processes query with chosen path context' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Optimized response' }
        ],
        components: ['Query Classifier', 'Route Gateway', 'Vector Index', 'Multi-Step Reasoning Loop', 'LLM Generator']
      },
      {
        id: 7,
        name: 'Agentic RAG',
        badge: '7',
        tagline: 'Agents plan, reason, act, and deliver better answers.',
        category: 'Autonomous AI Agents',
        color: 'from-purple-500 to-fuchsia-500',
        borderColor: 'border-purple-500',
        textColor: 'text-purple-400',
        bgColor: 'bg-purple-500/10',
        accentHex: '#a855f7',
        iconClass: 'fa-solid fa-robot',
        overview: 'An autonomous agent with Short/Long-Term Memory and ReAct/CoT Reasoning. Leverages Model Context Protocol (MCP) to invoke sub-agents, databases/APIs, web search engines, and cloud compute before self-correcting.',
        whenToUse: 'Complex research tasks, multi-database query synthesis, real-time live data queries, calculation + database lookup workflows.',
        limitations: 'Higher token consumption, variable latency, potential risk of infinite execution loops without max-iteration bounds.',
        metrics: { complexity: 'Very High (5/5)', latency: 'High (1.5s - 5s)', cost: 'High per Query', accuracy: '95-98%' },
        pipelineNodes: [
          { id: 'query', label: 'User Query', type: 'input', desc: 'Complex open-ended task' },
          { id: 'agent', label: 'Agent Core', type: 'llm', desc: 'Memory (Short/Long) + ReAct/CoT Planner' },
          { id: 'mcp', label: 'Agent Tools (MCP)', type: 'split', desc: 'Sub-Agents, DBs/APIs, Search Engines, Compute' },
          { id: 'loop', label: 'Self-Correction Loop', type: 'process', desc: 'Evaluates tool outputs and refines strategy' },
          { id: 'llm', label: 'Generation (LLM)', type: 'llm', desc: 'Synthesizes complete autonomous report' },
          { id: 'answer', label: 'Answer', type: 'output', desc: 'Verified, multi-source final solution' }
        ],
        components: ['ReAct/CoT Planner', 'Short/Long Term Memory', 'MCP Tool Bindings', 'Web Search', 'Database API Connectors', 'LLM Core']
      }
    ];

    const PRESET_QUERIES = [
      {
        id: 'simple',
        text: 'What is our 30-day product return policy?',
        bestPattern: 1,
        desc: 'Direct fact lookup -> Ideal for Naive or Contextual RAG'
      },
      {
        id: 'relational',
        text: 'How is Sarah from DevOps connected to the Payment Gateway repo?',
        bestPattern: 2,
        desc: 'Multi-hop relationship tracing -> Ideal for Graph RAG'
      },
      {
        id: 'hybrid_sku',
        text: 'Find specifications for SKU #FX-9000 and user reviews mentioning battery life.',
        bestPattern: 3,
        desc: 'Exact SKU code + broad semantic feedback -> Ideal for Hybrid RAG'
      },
      {
        id: 'abstract',
        text: 'Why do customer support ticket spikes occur after quarterly system updates?',
        bestPattern: 4,
        desc: 'Abstract conceptual query -> Ideal for HyDE'
      },
      {
        id: 'mixed',
        text: 'Calculate 150 * 24 and check current stock inventory for item #902',
        bestPattern: 7,
        desc: 'Requires calculations & live DB tool calls -> Ideal for Agentic RAG'
      }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('explorer');
      const [selectedArchId, setSelectedArchId] = useState(1);
      const [activeQuery, setActiveQuery] = useState(PRESET_QUERIES[0].text);
      const [isSimulating, setIsSimulating] = useState(false);
      const [simStep, setSimStep] = useState(0);
      const [simSpeed, setSimSpeed] = useState(1200);

      // Quiz state
      const [quizAnswers, setQuizAnswers] = useState({
        dataType: '',
        queryStyle: '',
        latencyPriority: '',
        toolRequirement: ''
      });
      const [quizRecommendation, setQuizRecommendation] = useState(null);

      // Gemini AI Analyst state
      const [aiAnalysis, setAiAnalysis] = useState('');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [customPrompt, setCustomPrompt] = useState('');

      const selectedArch = useMemo(() => {
        return RAG_ARCHITECTURES.find(a => a.id === selectedArchId) || RAG_ARCHITECTURES[0];
      }, [selectedArchId]);

      useEffect(() => {
        let timer;
        if (isSimulating) {
          if (simStep < selectedArch.pipelineNodes.length - 1) {
            timer = setTimeout(() => {
              setSimStep(prev => prev + 1);
            }, simSpeed);
          } else {
            setIsSimulating(false);
          }
        }
        return () => clearTimeout(timer);
      }, [isSimulating, simStep, selectedArch, simSpeed]);

      const startSimulation = () => {
        setSimStep(0);
        setIsSimulating(true);
      };

      const resetSimulation = () => {
        setIsSimulating(false);
        setSimStep(0);
      };

      const handleCalculateQuiz = () => {
        const { dataType, queryStyle, latencyPriority, toolRequirement } = quizAnswers;
        if (!dataType || !queryStyle || !latencyPriority || !toolRequirement) return;

        let recId = 1;
        if (toolRequirement === 'yes') recId = 7;
        else if (queryStyle === 'dynamic') recId = 6;
        else if (dataType === 'graph') recId = 2;
        else if (dataType === 'hybrid') recId = 3;
        else if (queryStyle === 'abstract') recId = 4;
        else if (dataType === 'documents') recId = 5;
        else recId = 1;

        setQuizRecommendation(RAG_ARCHITECTURES.find(a => a.id === recId));
      };

      const handleRunAiAnalysis = async () => {
        setIsAnalyzing(true);
        setAiAnalysis('');
        const promptTarget = customPrompt || activeQuery;

        try {
          // Gemini REST API simulation call
          const apiKey = "";
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{
                  text: `Act as a principal AI architect. Explain how the "${selectedArch.name}" RAG pattern will process this request:\n"${promptTarget}"\n\nInclude:\n1. Execution Pipeline Steps\n2. Key Artifacts Generated\n3. Latency & Accuracy Tradeoffs\n4. Recommendation for enterprise deployment.`
                }]
              }]
            })
          });

          if (!response.ok) throw new Error("API call failed");
          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text || "Analysis generated.";
          setAiAnalysis(text);
        } catch (err) {
          // Fallback detailed analysis if network/API is unavailable
          setAiAnalysis(`### Architectural Breakdown: ${selectedArch.name}\n\n**Query Analyzed:** "${promptTarget}"\n\n1. **Pipeline Execution Flow**:\n   - Step 1: Query received at entry gateway.\n   - Step 2: Custom transformations applied according to ${selectedArch.name} mechanics.\n   - Step 3: Retrieval execution against indexed data structures.\n   - Step 4: Final LLM synthesis with grounded context.\n\n2. **Performance Metrics**:\n   - Target Latency: ${selectedArch.metrics.latency}\n   - Estimated Accuracy Range: ${selectedArch.metrics.accuracy}\n   - System Complexity Tier: ${selectedArch.metrics.complexity}\n\n3. **Architectural Evaluation**:\n   ${selectedArch.whenToUse}`);
        } finally {
          setIsAnalyzing(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center space-x-3">
                <div className="p-2 bg-gradient-to-tr from-purple-600 to-blue-500 rounded-xl shadow-lg shadow-purple-500/20">
                  <i className="fa-solid fa-brain text-white text-lg"></i>
                </div>
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                    RAG Architectures Explorer
                  </h1>
                  <p className="text-[11px] text-slate-400 hidden sm:block">
                    Based on the 7 Core RAG Architectural Patterns
                  </p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <nav className="flex items-center space-x-1 bg-slate-950 p-1.5 rounded-xl border border-slate-800 text-xs font-medium">
                {[
                  { id: 'explorer', label: 'Architectures', icon: 'fa-solid fa-layer-group' },
                  { id: 'simulator', label: 'Playground', icon: 'fa-solid fa-play' },
                  { id: 'comparison', label: 'Comparison', icon: 'fa-solid fa-chart-simple' },
                  { id: 'quiz', label: 'Pattern Selector', icon: 'fa-solid fa-circle-question' },
                  { id: 'gemini', label: 'Gemini Analyst', icon: 'fa-solid fa-wand-magic-sparkles' }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg transition ${
                      activeTab === tab.id
                        ? 'bg-purple-600 text-white shadow-md shadow-purple-600/30 font-semibold'
                        : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900'
                    }`}
                  >
                    <i className={tab.icon}></i>
                    <span className="hidden md:inline">{tab.label}</span>
                  </button>
                ))}
              </nav>
            </div>
          </header>

          {/* Main Content Area */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

            {}
            {activeTab === 'explorer' && (
              <div className="space-y-6">
                {/* 7 Patterns Selection Bar */}
                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-2.5">
                  {RAG_ARCHITECTURES.map((arch) => {
                    const isSelected = selectedArchId === arch.id;
                    return (
                      <button
                        key={arch.id}
                        onClick={() => {
                          setSelectedArchId(arch.id);
                          resetSimulation();
                        }}
                        className={`flex flex-col items-between justify-between p-3 rounded-xl border text-left transition ${
                          isSelected
                            ? `${arch.borderColor} bg-slate-900 shadow-lg ring-1 ring-purple-500`
                            : 'border-slate-800/80 bg-slate-900/40 hover:bg-slate-900 hover:border-slate-700'
                        }`}
                      >
                        <div className="flex items-center justify-between w-full mb-2">
                          <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${arch.bgColor} ${arch.textColor}`}>
                            #{arch.badge}
                          </span>
                          <i className={`${arch.iconClass} text-xs ${isSelected ? arch.textColor : 'text-slate-500'}`}></i>
                        </div>
                        <span className="text-xs font-bold leading-tight text-slate-200 line-clamp-2">
                          {arch.name}
                        </span>
                      </button>
                    );
                  })}
                </div>

                {/* Selected Card Overview */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl relative overflow-hidden">
                  <div className={`absolute top-0 right-0 w-80 h-80 bg-gradient-to-bl ${selectedArch.color} opacity-10 blur-3xl pointer-events-none rounded-full`}></div>

                  <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 pb-6 border-b border-slate-800">
                    <div className="space-y-1">
                      <div className="flex items-center space-x-2">
                        <span className={`text-xs font-bold px-2.5 py-0.5 rounded-full ${selectedArch.bgColor} ${selectedArch.textColor} border border-current/20`}>
                          Pattern #{selectedArch.badge} • {selectedArch.category}
                        </span>
                      </div>
                      <h2 className="text-2xl sm:text-3xl font-extrabold text-white flex items-center gap-2">
                        {selectedArch.name}
                      </h2>
                      <p className="text-xs sm:text-sm text-purple-300 font-medium italic">
                        "{selectedArch.tagline}"
                      </p>
                    </div>

                    <button
                      onClick={() => {
                        setActiveTab('simulator');
                        startSimulation();
                      }}
                      className="flex items-center space-x-2 px-4 py-2.5 rounded-xl bg-purple-600 hover:bg-purple-500 font-semibold text-xs sm:text-sm text-white shadow-lg shadow-purple-600/30 transition self-start lg:self-center"
                    >
                      <i className="fa-solid fa-play"></i>
                      <span>Test in Playground</span>
                    </button>
                  </div>

                  {/* Flow Diagram */}
                  <div className="py-6 space-y-3">
                    <div className="flex items-center justify-between">
                      <h3 className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i className="fa-solid fa-diagram-next text-purple-400"></i>
                        Architecture Workflow Diagram
                      </h3>
                      <span className="text-[11px] text-slate-500">Step-by-step pipeline</span>
                    </div>

                    </p>

                  <span className={`text-xs font-bold px-2.5 py-1 rounded-lg ${selectedArch.bgColor} ${selectedArch.textColor} self-start sm:self-center`}>
                    #{selectedArch.badge} - {selectedArch.name}
                  </span>
                </div>

                <div className="space-y-4">
                  <div className="space-y-2">
                    <label className="text-xs font-bold text-slate-300 block">
                      Custom Scenario Prompt:
                    </label>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={customPrompt}
                        onChange={(e) => setCustomPrompt(e.target.value)}
                        placeholder={`e.g., "How does ${selectedArch.name} handle queries over 100,000 PDF documents?"`}
                        className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-purple-500"
                      />
                      <button
                        onClick={handleRunAiAnalysis}
                        disabled={isAnalyzing}
                        className="flex items-center space-x-2 bg-purple-600 hover:bg-purple-500 text-white px-5 py-2.5 rounded-xl font-bold text-xs shadow-lg shadow-purple-600/30 transition disabled:opacity-50"
                      >
                        {isAnalyzing ? (
                          <i className="fa-solid fa-spinner animate-spin"></i>
                        ) : (
                          <i className="fa-solid fa-wand-magic-sparkles"></i>
                        )}
                        <span>{isAnalyzing ? 'Analyzing...' : 'Analyze'}</span>
                      </button>
                    </div>
                  </div>

                  <div className="bg-slate-950 border border-slate-800 rounded-2xl p-6 min-h-[220px]">
                    <div className="flex items-center justify-between text-xs text-slate-500 border-b border-slate-800 pb-2 mb-4">
                      <span className="font-mono text-purple-400">AI SYSTEM DEEP DIVE REPORT</span>
                      <span>Model: gemini-3-flash-preview</span>
                    </div>

                    {isAnalyzing ? (
                      <div className="flex flex-col items-center justify-center py-12 space-y-3">
                        <i className="fa-solid fa-spinner text-purple-500 text-2xl animate-spin"></i>
                        <p className="text-xs text-slate-400 font-mono">Generating architectural assessment...</p>
                      </div>
                    ) : aiAnalysis ? (
                      <div className="text-xs text-slate-300 leading-relaxed whitespace-pre-wrap font-sans space-y-2">
                        {aiAnalysis}
                      </div>
                    ) : (
                      <div className="text-center py-12 text-slate-500 text-xs">
                        Click "Analyze" to generate a real-time architectural assessment.
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

          </main>

          {/* Footer */}
          <footer className="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
            <div className="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
              <p>RAG Architectures Interactive Guide • Ready for Edge & Chrome</p>
              <p className="text-slate-400">Naive • Graph • Hybrid • HyDE • Contextual • Adaptive • Agentic</p>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
