                            <h2 class="text-2xl sm:text-4xl font-extrabold text-white mb-2">${slide.title}</h2>
                            <p class="text-gray-400 text-xs sm:text-sm">${slide.subtitle}</p>
                        </div>

                        <div class="grid grid-cols-2 sm:grid-cols-4 md:grid-cols-5 gap-2.5 sm:gap-3">
                            ${conceptTitlesList.map((concept, i) => `
                                <button onclick="goToSlide(${i + 2})" class="glass-card p-3 rounded-xl border border-white/10 hover:border-brand-accent/60 hover:bg-brand-accent/20 transition text-left flex flex-col justify-between h-20 group">
                                    <span class="text-[10px] font-mono font-bold text-brand-glow group-hover:text-white">#${i + 1}</span>
                                    <span class="text-xs font-semibold text-gray-200 group-hover:text-white line-clamp-2 leading-snug">${concept}</span>
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else if (slide.type === 'outro') {
                // Questions & Outro slide
                html = `
                    <div class="glass-card rounded-3xl p-8 md:p-16 text-center max-w-3xl mx-auto flex flex-col items-center justify-center min-h-[420px] border border-white/10">
                        <div class="w-20 h-20 rounded-full bg-brand-accent/20 border border-brand-accent/40 flex items-center justify-center text-brand-glow text-3xl mb-8 shadow-lg shadow-brand-accent/20 animate-pulse">
                            <i class="fa-regular fa-comments"></i>
                        </div>

                        <h2 class="text-3xl sm:text-5xl font-extrabold text-white mb-4">
                            ${slide.title}
                        </h2>

                        <p class="text-gray-300 text-base sm:text-xl font-medium max-w-xl mb-8">
                            ${slide.subtitle}
                        </p>

                        <div class="text-xs sm:text-sm font-mono text-brand-glow px-4 py-2 rounded-full glass-pill">
                            ${slide.footer}
                        </div>
                    </div>
                `;
            } else {
                // Concept Slides (1 through 20)
                html = `
                    <div class="glass-card rounded-3xl p-6 sm:p-10 w-full max-w-4xl mx-auto border border-white/10 relative overflow-hidden">
                        <!-- Top Header Row -->
                        <div class="flex items-center justify-between gap-4 mb-8 pb-4 border-b border-white/10">
                            <div class="flex items-center gap-3">
                                <span class="w-10 h-10 rounded-xl bg-brand-accent/20 border border-brand-accent/40 text-brand-glow font-mono font-bold text-lg flex items-center justify-center">
                                    ${slide.number}
                                </span>
                                <div>
                                    <h2 class="text-xl sm:text-3xl font-extrabold text-white tracking-tight">
                                        ${slide.title}
                                    </h2>
                                </div>
                            </div>

                            <span class="px-3.5 py-1.5 rounded-full text-xs font-semibold glass-pill text-brand-glow shrink-0">
                                ${slide.badge}
                            </span>
                        </div>

                        <!-- Content Cards / Bullets -->
                        <div class="space-y-4">
                            ${slide.bullets.map((bullet, idx) => `
                                <div class="p-4 sm:p-5 rounded-2xl bg-navy-900/60 border border-white/5 hover:border-brand-accent/30 transition flex items-start gap-4">
                                    <div class="w-2 h-2 rounded-full bg-brand-lightBlue mt-2.5 shrink-0"></div>
                                    <div class="flex-1">
                                        <h3 class="text-sm sm:text-base font-bold text-white mb-1">
                                            ${bullet.title}
                                        </h3>
                                        <p class="text-xs sm:text-sm text-gray-300 leading-relaxed">
                                            ${bullet.text}
                                        </p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            // Animate transition
            activeSlideContainer.className = 'w-full slide-exit';
            setTimeout(() => {
                activeSlideContainer.innerHTML = html;
                activeSlideContainer.className = 'w-full slide-active';
            }, 150);
        }

        function initNavigationOptions() {
            // Populate select dropdown
            slideSelect.innerHTML = slideData.map((slide, idx) => {
                let label = '';
                if (slide.type === 'cover') label = '0. Reference Architecture Guide';
                else if (slide.type === 'roadmap') label = 'Roadmap Overview';
                else if (slide.type === 'outro') label = 'End: Questions & Discussion';
                else label = `${slide.number}. ${slide.title}`;
                return `<option value="${idx}">${label}</option>`;
            }).join('');

            // Populate Grid Modal Cards
            gridContainer.innerHTML = slideData.map((slide, idx) => {
                if (slide.type === 'cover') {
                    return `
                        <div onclick="goToSlide(${idx}); closeGrid();" class="glass-card p-4 rounded-2xl border border-brand-accent/40 cursor-pointer hover:scale-[1.02] transition">
                            <span class="text-[10px] font-mono uppercase text-brand-glow tracking-wider font-bold">Cover Slide</span>
                            <h3 class="text-sm font-extrabold text-white mt-1">Reference Architecture Guide</h3>
                        </div>
                    `;
                } else if (slide.type === 'roadmap') {
                    return `
                        <div onclick="goToSlide(${idx}); closeGrid();" class="glass-card p-4 rounded-2xl border border-white/20 cursor-pointer hover:scale-[1.02] transition">
                            <span class="text-[10px] font-mono uppercase text-gray-400 tracking-wider font-bold">Roadmap</span>
                            <h3 class="text-sm font-extrabold text-white mt-1">Overview Grid Index</h3>
                        </div>
                    `;
                } else if (slide.type === 'outro') {
                    return `
                        <div onclick="goToSlide(${idx}); closeGrid();" class="glass-card p-4 rounded-2xl border border-white/10 cursor-pointer hover:scale-[1.02] transition">
                            <span class="text-[10px] font-mono uppercase text-gray-400 tracking-wider font-bold">Outro</span>
                            <h3 class="text-sm font-extrabold text-white mt-1">Questions & Discussion</h3>
                        </div>
                    `;
                }
                return `
                    <div onclick="goToSlide(${idx}); closeGrid();" class="glass-card p-4 rounded-2xl border border-white/10 cursor-pointer hover:border-brand-accent/60 transition group hover:scale-[1.02]">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono font-bold text-brand-glow">#${slide.number}</span>
                            <span class="text-[10px] px-2 py-0.5 rounded-full glass-pill text-gray-300">${slide.badge}</span>
                        </div>
                        <h3 class="text-sm font-bold text-white group-hover:text-brand-glow transition">${slide.title}</h3>
                    </div>
                `;
            }).join('');
        }

        function goToSlide(index) {
            if (index >= 0 && index < slideData.length) {
                currentSlideIndex = index;
                renderSlide(currentSlideIndex);
            }
        }

        function nextSlide() {
            if (currentSlideIndex < slideData.length - 1) {
                goToSlide(currentSlideIndex + 1);
            } else if (isAutoplay) {
                toggleAutoplay(); // Stop at end
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                goToSlide(currentSlideIndex - 1);
            }
        }

        function toggleAutoplay() {
            isAutoplay = !isAutoplay;
            const icon = document.getElementById('autoplayIcon');
            const btn = document.getElementById('autoplayBtn');

            if (isAutoplay) {
                icon.className = 'fa-solid fa-pause text-amber-400';
                autoplayInterval = setInterval(nextSlide, 5000);
            } else {
                icon.className = 'fa-solid fa-play text-emerald-400';
                clearInterval(autoplayInterval);
            }
        }

        function openGrid() {
            gridModal.classList.remove('hidden');
            setTimeout(() => gridModal.classList.remove('opacity-0'), 10);
        }

        function closeGrid() {
            gridModal.classList.add('opacity-0');
            setTimeout(() => gridModal.classList.add('hidden'), 300);
        }

        function openSearch() {
            searchModal.classList.remove('hidden');
            searchInput.focus();
            performSearch();
        }

        function closeSearch() {
            searchModal.classList.add('hidden');
        }

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            if (!query) {
                searchResults.innerHTML = '<p class="text-xs text-gray-500 p-4 text-center">Type a keyword above to filter slides.</p>';
                return;
            }

            const matches = [];
            slideData.forEach((slide, idx) => {
                if (slide.type === 'cover' || slide.type === 'outro' || slide.type === 'roadmap') return;
                
                let matchCount = 0;
                if (slide.title.toLowerCase().includes(query)) matchCount += 3;
                if (slide.badge.toLowerCase().includes(query)) matchCount += 2;
                
                slide.bullets.forEach(b => {
                    if (b.title.toLowerCase().includes(query)) matchCount += 2;
                    if (b.text.toLowerCase().includes(query)) matchCount += 1;
                });

                if (matchCount > 0) {
                    matches.push({ slide, idx, score: matchCount });
                }
            });

            if (matches.length === 0) {
                searchResults.innerHTML = '<p class="text-xs text-gray-400 p-4 text-center">No matching concepts found.</p>';
                return;
            }

            searchResults.innerHTML = matches.map(m => `
                <div onclick="goToSlide(${m.idx}); closeSearch();" class="p-3 hover:bg-white/5 rounded-xl cursor-pointer transition flex items-center justify-between">
                    <div>
                        <div class="text-xs font-bold text-brand-glow">#${m.slide.number} ${m.slide.title}</div>
                        <div class="text-[11px] text-gray-400">${m.slide.badge}</div>
                    </div>
                    <i class="fa-solid fa-chevron-right text-xs text-gray-500"></i>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', () => {
            initNavigationOptions();
            renderSlide(currentSlideIndex);

            // Button Event Listeners
            prevBtn.addEventListener('click', prevSlide);
            nextBtn.addEventListener('click', nextSlide);
            document.getElementById('homeBtn').addEventListener('click', openGrid);
            document.getElementById('closeGridBtn').addEventListener('click', closeGrid);
            document.getElementById('autoplayBtn').addEventListener('click', toggleAutoplay);
            document.getElementById('searchToggleBtn').addEventListener('click', openSearch);
            document.getElementById('closeSearchBtn').addEventListener('click', closeSearch);

            slideSelect.addEventListener('change', (e) => {
                goToSlide(parseInt(e.target.value));
            });

            searchInput.addEventListener('input', performSearch);

            // Fullscreen Toggle
            document.getElementById('fullscreenBtn').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(() => {});
                } else {
                    document.exitFullscreen().catch(() => {});
                }
            });

            // Keyboard Navigation Shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT') return;

                if (e.key === 'ArrowRight' || e.key === 'Space') {
                    e.preventDefault();
                    nextSlide();
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    prevSlide();
                } else if (e.key === 'Escape') {
                    closeGrid();
                    closeSearch();
                } else if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    openSearch();
                }
            });

            // Touch Swipe Gestures
            let touchStartX = 0;
            let touchEndX = 0;

            document.body.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });

            document.body.addEventListener('touchend', (e) => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });

            function handleSwipe() {
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) nextSlide(); // Swipe left
                    else prevSlide(); // Swipe right
                }
            }
        });
    </script>
</body>
</html>
