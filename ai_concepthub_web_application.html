                if (e) e.stopPropagation();

            const cosineSimResult = useMemo(() => {
                let dot = 0, normA = 0, normB = 0;
                for(let i = 0; i < vectorVecA.length; i++) {
                    dot += vectorVecA[i] * vectorVecB[i];
                    normA += vectorVecA[i] ** 2;
                    normB += vectorVecB[i] ** 2;
                }

                                        className="px-5 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold disabled:opacity-40"
                                    >
                                        Next <i className="fa-solid fa-arrow-right ml-1"></i>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* VIEW 5: QUIZ VIEW */}
                        {currentView === 'quiz' && (
                            <div className="max-w-2xl mx-auto glass-panel p-8 rounded-3xl space-y-6">
                                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-graduation-cap text-indigo-400"></i> AI Knowledge Evaluator
                                    </h2>
                                    <span className="text-xs font-mono text-slate-400">
                                        Question {quizQuestionIndex + 1} of {QUIZ_QUESTIONS.length}
                                    </span>
                                </div>

                                {!quizSubmitted ? (
                                    <div className="space-y-6">
                                        <h3 className="text-base font-semibold text-slate-100">
                                            {QUIZ_QUESTIONS[quizQuestionIndex].q}
                                        </h3>

                                        <div className="space-y-3">
                                            {QUIZ_QUESTIONS[quizQuestionIndex].options.map((opt, idx) => (
                                                <button 
                                                    key={idx}
                                                    onClick={() => setSelectedQuizAnswer(idx)}
                                                    className={`w-full text-left p-3.5 rounded-xl text-xs font-medium border transition-all ${selectedQuizAnswer === idx ? 'bg-indigo-600/20 border-indigo-500 text-indigo-200' : 'bg-slate-900 border-slate-800 text-slate-300 hover:border-slate-700'}`}
                                                >
                                                    <span className="font-mono text-slate-500 mr-2">{String.fromCharCode(65 + idx)}.</span> {opt}
                                                </button>
                                            ))}
                                        </div>

                                        <button 
                                            disabled={selectedQuizAnswer === null}
                                            onClick={() => {
                                                if (selectedQuizAnswer === QUIZ_QUESTIONS[quizQuestionIndex].correct) {
                                                    setQuizScore(prev => prev + 1);
                                                }
                                                if (quizQuestionIndex < QUIZ_QUESTIONS.length - 1) {
                                                    setQuizQuestionIndex(prev => prev + 1);
                                                    setSelectedQuizAnswer(null);
                                                } else {
                                                    setQuizSubmitted(true);
                                                }
                                            }}
                                            className="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold disabled:opacity-40 transition-all shadow-lg shadow-indigo-600/30"
                                        >
                                            {quizQuestionIndex < QUIZ_QUESTIONS.length - 1 ? 'Submit Answer & Continue' : 'Finish Quiz'}
                                        </button>
                                    </div>
                                ) : (
                                    <div className="text-center py-8 space-y-4">
                                        <div className="w-16 h-16 bg-emerald-500/20 border border-emerald-500/30 text-emerald-400 rounded-full flex items-center justify-center text-2xl mx-auto">
                                            <i className="fa-solid fa-trophy"></i>
                                        </div>
                                        <h3 className="text-2xl font-extrabold text-white">Quiz Completed!</h3>
                                        <p className="text-sm text-slate-300">
                                            You scored <span className="font-bold text-emerald-400 text-lg">{quizScore}</span> out of <span className="font-bold text-white">{QUIZ_QUESTIONS.length}</span>
                                        </p>

                                        <button 
                                            onClick={() => {
                                                setQuizQuestionIndex(0);
                                                setQuizScore(0);
                                                setSelectedQuizAnswer(null);
                                                setQuizSubmitted(false);
                                            }}
                                            className="px-6 py-2.5 rounded-xl bg-indigo-600 text-white text-xs font-semibold"
                                        >
                                            Retake Quiz
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="mt-auto border-t border-slate-800/80 p-4 text-center text-xs text-slate-500 glass-panel">
                        AI ConceptHub Application &bull; Built for modern software engineers & developers.
                    </footer>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
